version: '3.8'

services:
  app:
    build: .
    container_name: sandbox-app
    ports:
      - "80:80"
      - "443:443"
      - "22:22"
    environment:
      - ENVIRONMENT=sandbox
      - AWS_REGION=${AWS_REGION:-us-east-1}
    env_file:
      - .env
    volumes:
      - app-data:/app/data
    networks:
      - sandbox-network
    restart: unless-stopped

networks:
  sandbox-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  app-data:
    driver: local
